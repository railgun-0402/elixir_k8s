services:
  postgres:
    image: postgres:17
    container_name: task-lab-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: task_lab_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d task_lab_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
