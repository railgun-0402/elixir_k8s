apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-lab
  template:
    metadata:
      labels:
        app: task-lab
    spec:
      containers:
        - name: task-lab
          image: task-lab:v2
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 4000

          env:
            - name: PHX_SERVER
              value: "true"

            - name: PHX_HOST
              value: "localhost"

            - name: PORT
              value: "4000"

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: task-lab-secret
                  key: DATABASE_URL

            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: task-lab-secret
                  key: SECRET_KEY_BASE

          livenessProbe:
            httpGet:
              path: /health/live
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2

          readinessProbe:
            httpGet:
              path: /health/ready
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: task-lab
spec:
  type: ClusterIP
  selector:
    app: task-lab
  ports:
    - port: 4000
      targetPort: 4000
