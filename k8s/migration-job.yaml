apiVersion: batch/v1
kind: Job
metadata:
  name: task-lab-migrate
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 2

  template:
    metadata:
      labels:
        app: task-lab-migrate
    spec:
      restartPolicy: Never

      containers:
        - name: migrate
          image: task-lab:v2
          imagePullPolicy: IfNotPresent

          command: ["/app/bin/migrate"]

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: task-lab-secret
                  key: DATABASE_URL

            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: task-lab-secret
                  key: SECRET_KEY_BASE

            - name: PHX_HOST
              value: "localhost"
