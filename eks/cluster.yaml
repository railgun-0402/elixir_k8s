apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: task-lab-eks
  region: ap-northeast-1

availabilityZones:
  - ap-northeast-1a
  - ap-northeast-1c

vpc:
  nat:
    gateway: Disable

  clusterEndpoints:
    publicAccess: true
    privateAccess: true

managedNodeGroups:
  - name: task-lab-ng
    instanceType: t3.medium
    desiredCapacity: 1
    minSize: 1
    maxSize: 1
    volumeSize: 20
    privateNetworking: false
